name: Required Compatibility Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Dependabot configuration
        run: test -f .github/dependabot.yml

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility check
        run: echo "legacy build required check compatibility"

  update-go-modules-graph:
    name: update-go_modules-graph
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility check
        run: echo "update-go_modules-graph compatibility check"
