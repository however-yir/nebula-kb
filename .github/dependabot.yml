version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Shanghai"
      day: "friday"
    target-branch: "main"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      timezone: "Asia/Shanghai"
      day: "friday"
    target-branch: "main"
    ignore:
      - dependency-name: "js-cookie"

  - package-ecosystem: "npm"
    directory: "/engines/yourrag/web"
    schedule:
      interval: "weekly"
      timezone: "Asia/Shanghai"
      day: "friday"
    target-branch: "main"
    ignore:
      - dependency-name: "js-cookie"
