<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NebulaKB Knowledge Health Dashboard</title>
  <desc id="desc">按知识库展示知识命中率、低质回答率、未命中问题、待处理反馈和过期知识。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1280" height="76" fill="#111827"/>
  <text x="40" y="48" fill="#ffffff" font-family="PingFang SC, Arial, sans-serif" font-size="28" font-weight="700">NebulaKB</text>
  <text x="190" y="48" fill="#a7f3d0" font-family="PingFang SC, Arial, sans-serif" font-size="16">Knowledge Health Dashboard</text>
  <rect x="1010" y="22" width="170" height="34" rx="6" fill="#ffffff" fill-opacity="0.12"/>
  <text x="1034" y="45" fill="#ffffff" font-family="PingFang SC, Arial, sans-serif" font-size="14">知识运营后台</text>

  <text x="54" y="128" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="30" font-weight="800">知识健康总览</text>
  <text x="54" y="156" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="15">从命中、质量、反馈、过期知识到治理任务，按知识库维度闭环。</text>

  <g filter="url(#shadow)">
