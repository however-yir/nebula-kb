  <g filter="url(#shadow)">
    <rect x="866" y="334" width="364" height="300" rx="8" fill="#ffffff"/>
    <text x="894" y="376" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="18" font-weight="800">低质答案回看</text>
    <rect x="894" y="408" width="112" height="30" rx="6" fill="#eff6ff"/>
    <text x="914" y="428" fill="#1d4ed8" font-family="PingFang SC, Arial, sans-serif" font-size="13">客服政策库</text>
    <rect x="1018" y="408" width="88" height="30" rx="6" fill="#fef3c7"/>
    <text x="1038" y="428" fill="#92400e" font-family="PingFang SC, Arial, sans-serif" font-size="13">引用缺失</text>
    <rect x="1118" y="408" width="72" height="30" rx="6" fill="#fee2e2"/>
    <text x="1138" y="428" fill="#991b1b" font-family="PingFang SC, Arial, sans-serif" font-size="13">待处理</text>

    <text x="894" y="478" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="700">解析失败后应该如何处理？</text>
    <text x="894" y="506" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="13">reason: 缺少负责人和 SLA</text>
    <text x="894" y="532" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="13">owner: knowledge-ops · status: open</text>
    <line x1="894" y1="556" x2="1198" y2="556" stroke="#e5e7eb"/>
    <text x="894" y="592" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="700">设备异常如何升级？</text>
    <text x="894" y="620" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="13">reason: 引用缺失 · owner: mfg-ops</text>
