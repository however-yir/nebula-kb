    <text x="274" y="482" fill="#059669" font-family="PingFang SC, Arial, sans-serif" font-size="15">84.6%</text>
    <text x="390" y="482" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">3.8%</text>
    <text x="506" y="482" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">14</text>
    <text x="620" y="482" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">5</text>
