    <text x="78" y="270" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="36" font-weight="800">82.4%</text>
    <text x="182" y="270" fill="#059669" font-family="PingFang SC, Arial, sans-serif" font-size="14">+6.8%</text>

    <rect x="294" y="190" width="216" height="112" rx="8" fill="#ffffff"/>
    <text x="318" y="226" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="14">低质回答率</text>
    <text x="318" y="270" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="36" font-weight="800">4.7%</text>
    <text x="410" y="270" fill="#059669" font-family="PingFang SC, Arial, sans-serif" font-size="14">-1.6%</text>

    <rect x="534" y="190" width="216" height="112" rx="8" fill="#ffffff"/>
    <text x="558" y="226" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="14">未命中问题数</text>
    <text x="558" y="270" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="36" font-weight="800">37</text>
    <text x="620" y="270" fill="#059669" font-family="PingFang SC, Arial, sans-serif" font-size="14">-8.1%</text>

    <rect x="774" y="190" width="216" height="112" rx="8" fill="#ffffff"/>
    <text x="798" y="226" fill="#64748b" font-family="PingFang SC, Arial, sans-serif" font-size="14">待处理反馈数</text>
    <text x="798" y="270" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="36" font-weight="800">12</text>
    <text x="858" y="270" fill="#059669" font-family="PingFang SC, Arial, sans-serif" font-size="14">-18.2%</text>

    <rect x="1014" y="190" width="216" height="112" rx="8" fill="#ffffff"/>
