    <text x="742" y="480" fill="#166534" font-family="PingFang SC, Arial, sans-serif" font-size="13">健康</text>

    <text x="82" y="538" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="700">法务条款库</text>
    <text x="274" y="538" fill="#b45309" font-family="PingFang SC, Arial, sans-serif" font-size="15">79.2%</text>
    <text x="390" y="538" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">5.1%</text>
    <text x="506" y="538" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">9</text>
    <text x="620" y="538" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">3</text>
    <rect x="720" y="516" width="68" height="28" rx="6" fill="#fef3c7"/>
    <text x="742" y="536" fill="#92400e" font-family="PingFang SC, Arial, sans-serif" font-size="13">关注</text>

    <text x="82" y="594" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15" font-weight="700">制造 SOP 库</text>
    <text x="274" y="594" fill="#dc2626" font-family="PingFang SC, Arial, sans-serif" font-size="15">73.5%</text>
    <text x="390" y="594" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">6.4%</text>
    <text x="506" y="594" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">14</text>
    <text x="620" y="594" fill="#0f172a" font-family="PingFang SC, Arial, sans-serif" font-size="15">4</text>
