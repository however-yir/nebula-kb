<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NebulaKB 问答反馈截图</title>
  <desc id="desc">问答反馈页面，展示答案引用、评分、低质答案回看和闭环状态。</desc>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1280" height="74" fill="#12323f"/>
  <text x="42" y="47" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">NebulaKB</text>
  <text x="278" y="132" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">问答反馈</text>
  <text x="278" y="162" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">把每一次不满意答案转成可追踪的知识治理任务。</text>

  <rect x="278" y="194" width="550" height="440" rx="8" fill="#ffffff"/>
  <text x="306" y="235" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">问答记录</text>
  <rect x="306" y="268" width="494" height="74" rx="8" fill="#eef2ff"/>
  <text x="330" y="298" fill="#3730a3" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">问题</text>
  <text x="330" y="324" fill="#1e293b" font-family="Inter, Arial, sans-serif" font-size="15">解析失败后应该如何处理？</text>
  <rect x="306" y="362" width="494" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="330" y="392" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">答案</text>
  <text x="330" y="422" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">扫描件缺少文本层时，应进入待处理队列，补充 OCR 或上传可解析版本。</text>
  <rect x="330" y="442" width="150" height="26" rx="13" fill="#dbeafe"/>
  <text x="346" y="460" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">引用：入库治理 SOP</text>
  <rect x="306" y="508" width="494" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="330" y="540" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">人工反馈</text>
  <text x="330" y="568" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="14">评分 2/5：没有说明责任人和 SLA，需要补充运营规则。</text>

  <rect x="858" y="194" width="372" height="440" rx="8" fill="#ffffff"/>
  <text x="886" y="235" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">低质答案回看</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14">
    <rect x="886" y="268" width="316" height="76" rx="8" fill="#fee2e2"/>
    <text x="906" y="298" fill="#991b1b" font-weight="800">待分派</text>
    <text x="906" y="324" fill="#334155">解析失败处理缺少 SLA</text>
    <rect x="886" y="366" width="316" height="76" rx="8" fill="#fef3c7"/>
    <text x="906" y="396" fill="#92400e" font-weight="800">处理中</text>
    <text x="906" y="422" fill="#334155">退款政策答案引用过期</text>
    <rect x="886" y="464" width="316" height="76" rx="8" fill="#dcfce7"/>
    <text x="906" y="494" fill="#166534" font-weight="800">已闭环</text>
    <text x="906" y="520" fill="#334155">补充发票变更说明</text>
    <rect x="886" y="562" width="150" height="38" rx="6" fill="#2563eb"/>
    <text x="914" y="586" fill="#ffffff" font-weight="700">生成治理任务</text>
  </g>
</svg>
